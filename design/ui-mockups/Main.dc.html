<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap">
  <style>
    body { margin: 0; background: #0B1212; color: #DED6C4; font-family: "Crimson Pro", Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }
    a { color: #C7A14A; text-decoration: none; } a:hover { color: #DED6C4; }
    .disp { font-family: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif; font-weight: 900; letter-spacing: .01em; text-transform: uppercase; }
    .type { font-family: "Special Elite", "Courier New", monospace; }
    .menu:hover { color: #DED6C4 !important; border-left-color: #DED6C4 !important; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #0B1212; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Backdrop: ritual compass mark, sunk into the ground tone -->
  <svg width="1100" height="1100" viewBox="0 0 1100 1100" fill="none" stroke="#C7A14A" stroke-width="1" style="position: absolute; right: -260px; top: -100px; opacity: .12;">
    <circle cx="550" cy="550" r="520"/>
    <circle cx="550" cy="550" r="400" stroke-dasharray="4 10"/>
    <circle cx="550" cy="550" r="260"/>
    <circle cx="550" cy="550" r="120" stroke-dasharray="2 6"/>
    <path d="M550 30v1040M30 550h1040"/>
    <path d="M182 182l736 736M918 182L182 918" stroke-opacity=".5"/>
    <circle cx="550" cy="550" r="18" fill="#C7A14A" stroke="none"/>
  </svg>

  <!-- Portrait band, right side -->
  <div style="position: absolute; right: 120px; top: 96px; width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;">
    <div style="aspect-ratio: 1 / 1.1; overflow: hidden; background: #111A1A; border-bottom: 3px solid #FF8C1F; margin-top: 48px;"><img src="sapper.webp" alt="The Sapper" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;"></div>
    <div style="aspect-ratio: 1 / 1.1; overflow: hidden; background: #111A1A; border-bottom: 3px solid #4DCCFF;"><img src="photographer.webp" alt="The Photographer" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;"></div>
    <div style="aspect-ratio: 1 / 1.1; overflow: hidden; background: #111A1A; border-bottom: 3px solid #B359FF; margin-top: 48px;"><img src="medium.webp" alt="The Medium" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;"></div>
    <div style="aspect-ratio: 1 / 1.1; overflow: hidden; background: #111A1A; border-bottom: 3px solid #40FF99;"><img src="smuggler.webp" alt="The Smuggler" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;"></div>
  </div>

  <!-- Title and menu -->
  <div style="position: relative; flex: 1; padding: 120px 0 0 120px; display: flex; flex-direction: column; gap: 56px;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="type" style="font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: #C7A14A;">Four investigators · one ritual</div>
      <div class="disp" style="font-size: 148px; line-height: .84; color: #DED6C4; text-wrap: balance;">Dread<br><span style="color: #C7A14A;">Meridian</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; width: 420px;">
      <a class="menu" href="#" style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 22px 0 26px; border-left: 3px solid #C7A14A; background: #111A1A; color: #C7A14A; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 34px; letter-spacing: .08em; text-transform: uppercase;">
        <span>Start</span>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h10M10 4l5 5-5 5"/></svg>
      </a>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 22px 0 26px; border-left: 3px solid #2A3535; color: #4A5352; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 34px; letter-spacing: .08em; text-transform: uppercase; cursor: default;">
        <span>Settings</span>
        <span class="type" style="font-size: 11px; letter-spacing: .14em; color: #4A5352; border: 1px solid #2A3535; padding: 4px 8px;">Not yet available</span>
      </div>
      <a class="menu" href="#" style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 22px 0 26px; border-left: 3px solid #2A3535; color: #8C948F; font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 900; font-size: 34px; letter-spacing: .08em; text-transform: uppercase;">
        <span>Exit to desktop</span>
      </a>
    </div>
  </div>

  <!-- Bottom bar -->
  <div style="position: relative; height: 72px; padding: 0 120px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(199,161,74,.3); box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 28px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #8C948F;"><span class="type" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #8C948F; border-radius: 50%; font-size: 12px; color: #DED6C4;">A</span>Select</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #8C948F;"><span class="type" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #8C948F; border-radius: 50%; font-size: 12px; color: #DED6C4;">B</span>Back</div>
    </div>
    <div class="type" style="font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #8C948F;">Build [BUILD] · Unreal 5.8.2</div>
  </div>

</div>
</x-dc>
</body>
</html>
