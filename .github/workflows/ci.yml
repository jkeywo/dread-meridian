name: Portable contract checks
on: [push, pull_request]
jobs:
  capture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      # Unreal compilation/automation requires the pinned engine; see tools/Unreal.ps1.
